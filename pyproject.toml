[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tads"
version = "0.1.0"
description = "Temporal Anomaly Detection System for cybersecurity telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Elasticsearch client (Constraint #1)
    "elasticsearch>=8.0.0,<9.0.0",

    # Columnar I/O & data processing (Constraints #13, #16, #17)
    "pyarrow>=15.0.0",
    "polars>=1.0.0",
    "duckdb>=1.0.0",

    # ML: Primary (PyTorch)
    "torch>=2.0.0",

    # ML: Baselines (scikit-learn)
    "scikit-learn>=1.4.0",

    # Configuration & validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",

    # Credentials & environment
    "python-dotenv>=1.0.0",

    # Utilities
    "structlog>=24.0.0",
    "click>=8.0.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
    "detect-secrets>=1.4.0",
]

[project.scripts]
tads-ingest = "tads.cli:ingest"
tads-train = "tads.cli:train"
tads-infer = "tads.cli:infer"
tads-experiment = "tads.cli:experiment"

# ============================================================
# Tool configurations
# ============================================================

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["tads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "data_quality: marks data quality tests",
    "leakage: marks leakage detection tests",
]

[tool.coverage.run]
source = ["tads"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.hatch.build.targets.wheel]
packages = ["src/tads"]
